<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Data Binding</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 16px; font-size: 13px; }
    h1 { margin: 0 0 14px; font-size: 16px; }
    .card { border: 1px solid rgba(127,127,127,.35); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid rgba(127,127,127,.5); background: transparent; }
    textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    button { border: 1px solid rgba(127,127,127,.45); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
    .primary { font-weight: 700; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .muted { opacity: .72; font-size: 12px; }
    #status { margin-top: 10px; min-height: 18px; }
    .ok { color: #2e9d5b; }
    .error { color: #d14b4b; }
    code { font-size: 11px; }
  </style>
</head>
<body>
  <h1>XML Data Binding</h1>

  <div class="card">
    <label>1. XML source layer</label>
    <div id="sourceName" class="muted">No source selected.</div>
    <div class="row" style="margin-top:8px">
      <button id="markSource">Use selected text as source</button>
      <button id="reloadSource">Reload source</button>
    </div>
    <textarea id="xmlPreview" readonly placeholder="XML from the source text layer appears here"></textarea>
  </div>

  <div class="card">
    <label>2. Target text layer</label>
    <div id="targetName" class="muted">Select a text layer in Penpot.</div>

    <label for="path" style="margin-top:10px">XML path</label>
    <input id="path" value="/product/name" placeholder="/product/name" />
    <div class="muted" style="margin-top:6px">Simple element paths are supported, e.g. <code>/product/name</code>. Attributes: <code>/product/@id</code>.</div>

    <div class="row" style="margin-top:10px">
      <button id="bind" class="primary">Bind selected layer</button>
      <button id="unbind">Remove binding</button>
    </div>
  </div>

  <button id="refresh" class="primary" style="width:100%">Refresh all bindings</button>
  <div id="status" class="muted"></div>

<script>
  let source = null;
  let selection = null;

  const $ = (id) => document.getElementById(id);
  const send = (message) => parent.postMessage(message, "*");

  function setStatus(text, level = "") {
    $("status").textContent = text;
    $("status").className = level || "muted";
  }

  function renderSource() {
    $("sourceName").textContent = source ? `${source.name} (${source.id})` : "No source selected.";
    $("xmlPreview").value = source?.characters || "";
  }

  function renderSelection() {
    $("targetName").textContent = selection ? `${selection.name} (${selection.id})` : "Select a text layer in Penpot.";
    if (selection?.path) $("path").value = selection.path;
  }

  function resolveXml(xml, path) {
    if (!xml || !path) throw new Error("Missing XML or path");
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const parserError = doc.querySelector("parsererror");
    if (parserError) throw new Error("Invalid XML");

    const parts = path.split("/").filter(Boolean);
    let node = doc.documentElement;
    if (!node) throw new Error("XML has no root element");

    if (parts[0] === node.nodeName) parts.shift();

    for (const part of parts) {
      if (part.startsWith("@")) {
        const value = node.getAttribute(part.slice(1));
        if (value == null) throw new Error(`Attribute ${part} not found`);
        return value;
      }
      const next = Array.from(node.children).find((child) => child.nodeName === part);
      if (!next) throw new Error(`Element ${part} not found`);
      node = next;
    }

    return node.textContent?.trim() ?? "";
  }

  $("markSource").onclick = () => send({ type: "mark-source" });
  $("reloadSource").onclick = () => send({ type: "get-default-source" });
  $("bind").onclick = () => {
    if (!source) return setStatus("Choose an XML source first.", "error");
    const path = $("path").value.trim();
    try {
      const preview = resolveXml(source.characters, path);
      setStatus(`Preview: ${preview}`, "ok");
      send({ type: "bind", sourceId: source.id, path });
    } catch (err) {
      setStatus(err.message || String(err), "error");
    }
  };
  $("unbind").onclick = () => send({ type: "unbind" });
  $("refresh").onclick = () => {
    setStatus("Refreshing…", "muted");
    send({ type: "refresh-all" });
  };

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;

    if (msg.type === "selection") {
      selection = msg.shape;
      renderSelection();
    }

    if (msg.type === "source-marked" || msg.type === "default-source") {
      source = msg.source;
      renderSource();
      if (source) setStatus("XML source ready.", "ok");
    }

    if (msg.type === "status") setStatus(msg.text, msg.level);

    if (msg.type === "refresh-data") {
      const results = (msg.items || []).map((item) => {
        if (item.xml == null) {
          return { targetId: item.targetId, ok: false, error: "Source layer not found" };
        }
        try {
          return { targetId: item.targetId, ok: true, value: resolveXml(item.xml, item.path) };
        } catch (err) {
          return { targetId: item.targetId, ok: false, error: err.message || String(err) };
        }
      });
      send({ type: "apply-values", results });
    }

    if (msg.type === "refresh-result") {
      const suffix = msg.errors?.length ? ` ${msg.errors.length} error(s): ${msg.errors.join("; ")}` : "";
      setStatus(`Updated ${msg.updated} layer(s).${suffix}`, msg.errors?.length ? "error" : "ok");
    }
  });

  send({ type: "get-default-source" });
  send({ type: "get-selection" });
</script>
</body>
</html>
