<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPath Inspector</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 16px; font-size: 13px; }
    h1 { margin: 0 0 14px; font-size: 16px; }
    section { border-bottom: 1px solid rgba(127,127,127,.35); padding-bottom: 14px; margin-bottom: 14px; }
    #sourceName, #targetName, #status, #valuePreview { overflow-wrap: anywhere; }
    #sourceName, #targetName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px; height: 18px; }
    #valuePreview { display: block; min-height: 40px; max-height: 100px; overflow: auto; white-space: pre-wrap; margin-top: 6px; }
    details { margin-top: 10px; }
    summary { cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid rgba(127,127,127,.5); background: transparent; }
    textarea { min-height: 100px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    #path { min-height: 64px; margin: 0; font-size: 12px; }
    button { border: 1px solid rgba(127,127,127,.45); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
    .primary { font-weight: 700; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    .muted { opacity: .72; font-size: 12px; }
    #status { margin-top: 10px; min-height: 18px; }
    .ok { color: #2e9d5b; }
    .error { color: #d14b4b; }
    code { font-size: 11px; }
    dialog { box-sizing: border-box; width: calc(100% - 24px); height: calc(100% - 24px); max-width: 900px; max-height: none; padding: 12px; border: 1px solid rgba(127,127,127,.5); border-radius: 6px; }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    #sourceEditor[open] { display: flex; flex-direction: column; gap: 10px; }
    #sourceEditor h2 { margin: 0; font-size: 16px; }
    #editorSourceName { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-height: 18px; }
    #xmlEditor { flex: 1; min-height: 100px; resize: none; font-size: 13px; line-height: 1.5; tab-size: 2; white-space: pre; }
    .editor-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #xmlImport { min-width: 0; max-width: 100%; }
    #editorDiagnostic { max-height: 92px; min-height: 18px; overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap; }
    #refreshAfterSave { width: auto; }
    .check-label { font-weight: normal; margin: 0; }
  </style>
</head>
<body>
  <h1>XPath Inspector</h1>

  <section>
    <label>Text layer name</label>
    <div id="targetName" class="muted">No single text layer selected.</div>
    <label for="path" style="margin-top:10px">XPath</label>
    <textarea id="path" spellcheck="false" disabled></textarea>
    <label for="valuePreview" style="margin-top:10px">Value preview</label>
    <output id="valuePreview" class="muted" aria-live="polite"></output>
    <div class="row" style="margin-top:10px">
      <button id="bind" class="primary" disabled>Apply binding</button>
      <button id="unbind" disabled>Remove binding</button>
    </div>
  </section>

  <section>
    <label>XML source layer name</label>
    <div id="sourceName" class="muted">No source selected.</div>
    <div id="sourceStorage" class="muted"></div>
    <div class="row" style="margin-top:8px">
      <button id="markSource" disabled>Set selection as source</button>
      <button id="reloadSource">Reload</button>
    </div>
    <button id="editSource" class="primary" style="width:100%;margin-top:8px" disabled>Edit XML source</button>
    <details>
      <summary>Source XML</summary>
      <textarea id="xmlPreview" aria-label="Source XML" readonly></textarea>
    </details>
  </section>

  <button id="refresh" class="primary" style="width:100%">Refresh all bindings</button>
  <div id="status" class="muted" role="status"></div>

  <dialog id="sourceEditor" aria-labelledby="editorTitle">
    <h2 id="editorTitle">XML source editor</h2>
    <div id="editorSourceName" class="muted"></div>
    <label for="xmlImport">Import XML file</label>
    <input id="xmlImport" type="file" accept=".xml,text/xml,application/xml" />
    <div class="editor-tools">
      <button id="validateXml">Validate XML</button>
      <button id="cleanXml">Clean tag separators</button>
    </div>
    <textarea id="xmlEditor" aria-label="XML source code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
    <div id="editorPosition" class="muted"></div>
    <div id="editorDiagnostic" role="status" aria-live="polite"></div>
    <label class="check-label"><input type="checkbox" id="refreshAfterSave" checked /> Refresh bindings after saving</label>
    <div class="row">
      <button id="saveSource" class="primary">Save source</button>
      <button id="closeEditor">Close</button>
    </div>
  </dialog>

<script>
  let source = null;
  let selection = null;
  let pageId = null;
  let fileId = null;
  let editorSession = null;
  let savingSource = false;

  const $ = (id) => document.getElementById(id);
  const send = (message) => parent.postMessage(message, "*");

  function setStatus(text, level = "") {
    $("status").textContent = text;
    $("status").className = level || "muted";
  }

  function renderSource() {
    $("sourceName").textContent = source ? source.name : selection?.sourceId ? "Bound source not found on this page." : "No source selected.";
    $("sourceName").title = source?.id || "";
    $("xmlPreview").value = source?.characters || "";
    $("sourceStorage").textContent = source ? source.storage === "plugin" ? "Editor-managed XML" : "Canvas text" : "";
    $("editSource").disabled = !source;
  }

  function renderSelection() {
    $("targetName").textContent = selection ? selection.name : "No single text layer selected.";
    $("targetName").title = selection?.id || "";
    $("path").disabled = !selection;
    $("markSource").disabled = !selection;
    $("unbind").disabled = !selection?.sourceId;
    renderSource();
    renderPreview();
  }

  function renderPreview() {
    $("bind").disabled = true;
    $("valuePreview").className = "muted";
    $("valuePreview").textContent = "";
    if (!selection || !source || !$("path").value.trim()) return;
    if (selection.id === source.id) return;
    try {
      const value = resolveXml(source.characters, $("path").value.trim());
      $("valuePreview").textContent = value === "" ? "(empty value)" : value;
      $("bind").disabled = false;
    } catch (err) {
      $("valuePreview").textContent = err.message || String(err);
      $("valuePreview").className = "error";
    }
  }

  function normalizeXmlMarkup(xml) {
    return xml.replace(/\x3c!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<(?:"[^"]*"|'[^']*'|[^'">])*>/g, (markup) => {
      if (markup.startsWith("<!") || markup.startsWith("<?")) return markup;
      return markup.replace(/^<\/\u200b+/, "</").replace(/\/\u200b+>$/, "/>");
    });
  }

  function parseXml(xml) {
    if (!xml.trim()) throw new Error("XML must not be empty");
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const parserError = doc.getElementsByTagNameNS("http://www.mozilla.org/newlayout/xml/parsererror.xml", "parsererror")[0]
      || doc.getElementsByTagNameNS("http://www.w3.org/1999/xhtml", "parsererror")[0];
    if (parserError) throw new Error(`Invalid XML: ${parserError.textContent?.trim() || "Parse error"}`);
    return doc;
  }

  function resolveXml(xml, path) {
    if (!xml || !path) throw new Error("Missing XML or path");
    const doc = parseXml(normalizeXmlMarkup(xml));

    let result;
    try {
      result = doc.evaluate(path, doc, doc.createNSResolver(doc.documentElement), XPathResult.ANY_TYPE, null);
    } catch {
      throw new Error("Invalid XPath or unknown namespace prefix");
    }

    if (result.resultType === XPathResult.STRING_TYPE) return result.stringValue;
    if (result.resultType === XPathResult.NUMBER_TYPE) return String(result.numberValue);
    if (result.resultType === XPathResult.BOOLEAN_TYPE) return String(result.booleanValue);
    const node = doc.evaluate(path, doc, doc.createNSResolver(doc.documentElement), XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
    if (!node) throw new Error("XPath has no matches");
    return node.textContent?.trim() ?? "";
  }

  function editorDiagnostic(text, level = "muted") {
    $("editorDiagnostic").textContent = text;
    $("editorDiagnostic").className = level;
  }

  function updateEditorState() {
    const xml = $("xmlEditor").value;
    const beforeCursor = xml.slice(0, $("xmlEditor").selectionStart);
    const line = beforeCursor.split("\n").length;
    const column = beforeCursor.length - beforeCursor.lastIndexOf("\n");
    const invisibleCount = (xml.match(/\u200b/g) || []).length;
    $("editorPosition").textContent = `Line ${line}, column ${column} | ${xml.split("\n").length} lines | ${invisibleCount} U+200B`;
    const dirty = editorSession && xml !== editorSession.originalXml;
    $("closeEditor").textContent = dirty ? "Discard and close" : "Close";
    for (const id of ["xmlEditor", "xmlImport", "validateXml", "cleanXml", "closeEditor", "refreshAfterSave"]) $(id).disabled = savingSource;
    $("saveSource").disabled = savingSource || !xml.trim();
  }

  function validateEditor() {
    try {
      parseXml($("xmlEditor").value);
      editorDiagnostic("Valid XML", "ok");
      return true;
    } catch (error) {
      editorDiagnostic(error.message || String(error), "error");
      return false;
    }
  }

  $("editSource").onclick = () => {
    if (!source) return;
    editorSession = { sourceId: source.id, originalXml: source.characters, pageId, fileId };
    $("editorSourceName").textContent = source.name;
    $("xmlEditor").value = source.characters;
    $("xmlImport").value = "";
    savingSource = false;
    updateEditorState();
    validateEditor();
    $("sourceEditor").showModal();
    send({ type: "editor-size", expanded: true });
    $("xmlEditor").focus();
  };
  $("xmlEditor").oninput = () => {
    editorDiagnostic("Unsaved changes");
    updateEditorState();
  };
  $("xmlEditor").onkeyup = updateEditorState;
  $("xmlEditor").onclick = updateEditorState;
  $("validateXml").onclick = validateEditor;
  $("cleanXml").onclick = () => {
    const original = $("xmlEditor").value;
    $("xmlEditor").value = normalizeXmlMarkup(original);
    const removed = original.length - $("xmlEditor").value.length;
    updateEditorState();
    if (validateEditor()) editorDiagnostic(`Valid XML. Removed ${removed} tag separator characters.`, "ok");
  };
  $("xmlImport").onchange = async () => {
    const file = $("xmlImport").files[0];
    if (!file || !editorSession) return;
    const session = editorSession;
    const originalDraft = $("xmlEditor").value;
    try {
      const bytes = await file.arrayBuffer();
      const xml = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      if (editorSession !== session || savingSource) return;
      if ($("xmlEditor").value !== originalDraft) {
        editorDiagnostic("Import cancelled: the draft changed while the file was loading.", "error");
        return;
      }
      $("xmlEditor").value = xml;
      updateEditorState();
      validateEditor();
    } catch (error) {
      if (editorSession === session) editorDiagnostic(`Import failed (UTF-8 required): ${error.message || String(error)}`, "error");
    }
  };
  $("saveSource").onclick = () => {
    if (!editorSession || savingSource || !validateEditor()) return;
    savingSource = true;
    updateEditorState();
    editorDiagnostic("Saving source...");
    send({ type: "save-source", ...editorSession, xml: $("xmlEditor").value });
  };
  $("closeEditor").onclick = () => {
    if (!savingSource) $("sourceEditor").close();
  };
  $("sourceEditor").oncancel = (event) => {
    if (savingSource || (editorSession && $("xmlEditor").value !== editorSession.originalXml)) {
      event.preventDefault();
      if (!savingSource) editorDiagnostic("Unsaved changes", "error");
    }
  };
  $("sourceEditor").onclose = () => {
    editorSession = null;
    send({ type: "editor-size", expanded: false });
  };

  $("markSource").onclick = () => send({ type: "mark-source" });
  $("reloadSource").onclick = () => send({ type: "get-selection" });
  $("path").oninput = renderPreview;
  $("bind").onclick = () => {
    if (!source) return setStatus("Choose an XML source first.", "error");
    const path = $("path").value.trim();
    try {
      const value = resolveXml(source.characters, path);
      send({ type: "bind", targetId: selection?.id, sourceId: source.id, xml: source.characters, path, value });
    } catch (err) {
      setStatus(err.message || String(err), "error");
    }
  };
  $("unbind").onclick = () => send({ type: "unbind", targetId: selection?.id });
  $("refresh").onclick = () => {
    setStatus("Refreshing…", "muted");
    send({ type: "refresh-all" });
  };

  window.addEventListener("message", (event) => {
    if (event.source !== parent) return;
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;

    if (msg.type === "selection") {
      pageId = msg.pageId;
      fileId = msg.fileId;
      if (selection?.id !== msg.shape?.id || selection?.path !== msg.shape?.path) {
        $("path").value = msg.shape?.path || "";
      }
      selection = msg.shape;
      source = msg.source;
      renderSelection();
    }

    if (msg.type === "status") setStatus(msg.text, msg.level);

    if (msg.type === "source-save-error" && editorSession) {
      savingSource = false;
      updateEditorState();
      editorDiagnostic(msg.text, "error");
    }

    if (msg.type === "source-saved" && editorSession?.sourceId === msg.sourceId) {
      savingSource = false;
      $("sourceEditor").close();
      setStatus("XML source saved in plugin data.", "ok");
      if ($("refreshAfterSave").checked) send({ type: "refresh-all" });
    }

    if (msg.type === "refresh-data") {
      const results = (msg.items || []).map((item) => {
        if (item.xml == null) {
          return { targetId: item.targetId, ok: false, error: "Source layer not found" };
        }
        try {
          return { targetId: item.targetId, ok: true, value: resolveXml(item.xml, item.path) };
        } catch (err) {
          return { targetId: item.targetId, ok: false, error: err.message || String(err) };
        }
      });
      send({ type: "apply-values", results });
    }

    if (msg.type === "refresh-result") {
      const suffix = msg.errors?.length ? ` ${msg.errors.length} error(s): ${msg.errors.join("; ")}` : "";
      setStatus(`Updated ${msg.updated} layer(s).${suffix}`, msg.errors?.length ? "error" : "ok");
    }
  });

  send({ type: "get-selection" });
</script>
</body>
</html>
