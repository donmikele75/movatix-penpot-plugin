<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPath Inspector</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 16px; font-size: 13px; }
    h1 { margin: 0 0 14px; font-size: 16px; }
    section { border-bottom: 1px solid rgba(127,127,127,.35); padding-bottom: 14px; margin-bottom: 14px; }
    #sourceName, #targetName, #status, #valuePreview { overflow-wrap: anywhere; }
    #sourceName, #targetName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px; height: 18px; }
    #valuePreview { display: block; min-height: 40px; max-height: 100px; overflow: auto; white-space: pre-wrap; margin-top: 6px; }
    details { margin-top: 10px; }
    summary { cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, textarea, button, select { font: inherit; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid rgba(127,127,127,.5); background: transparent; }
    textarea { min-height: 100px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    #path { min-height: 64px; margin: 0; font-size: 12px; }
    button { border: 1px solid rgba(127,127,127,.45); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
    .primary { font-weight: 700; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    .muted { opacity: .72; font-size: 12px; }
    #status { margin-top: 10px; min-height: 18px; }
    .ok { color: #2e9d5b; }
    .error { color: #d14b4b; }
    code { font-size: 11px; }
    dialog { box-sizing: border-box; width: calc(100% - 24px); height: calc(100% - 24px); max-width: 900px; max-height: none; padding: 12px; border: 1px solid rgba(127,127,127,.5); border-radius: 6px; }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    #sourceEditor[open] { display: flex; flex-direction: column; gap: 10px; }
    #sourceEditor h2 { margin: 0; font-size: 16px; }
    #xmlCodeSurface { position: relative; flex: 1; min-height: 100px; border: 1px solid rgba(127,127,127,.5); border-radius: 6px; overflow: hidden; }
    #xmlCodeSurface:focus-within { outline: 2px solid #258a9b; outline-offset: 1px; }
    #xmlEditor, #xmlHighlight { box-sizing: border-box; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 12px; border: 0; border-radius: 0; font: 13px/20px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; tab-size: 2; white-space: pre; font-variant-ligatures: none; }
    #xmlEditor { resize: none; min-height: 0; outline: none; background: transparent; }
    #xmlHighlight { overflow: hidden; pointer-events: none; }
    #xmlCodeSurface.highlighted #xmlEditor { color: transparent; caret-color: #202124; }
    #xmlCodeSurface.highlighted #xmlEditor::selection { background: rgba(40,130,180,.3); color: transparent; }
    .token.tag, .token.keyword { color: #a52150; }
    .token.attr-name { color: #795d00; }
    .token.attr-value, .token.string { color: #147348; }
    .token.comment, .token.prolog, .token.doctype { color: #65716d; }
    .token.punctuation { color: #525e68; }
    .token.entity, .token.cdata { color: #007888; }
    @media (prefers-color-scheme: dark) {
      #xmlCodeSurface.highlighted #xmlEditor { caret-color: #f5f5f5; }
      .token.tag, .token.keyword { color: #ff8fab; }
      .token.attr-name { color: #e4c477; }
      .token.attr-value, .token.string { color: #88d6aa; }
      .token.comment, .token.prolog, .token.doctype { color: #a1aaa6; }
      .token.punctuation { color: #bcc6ce; }
      .token.entity, .token.cdata { color: #7bd3df; }
    }
    @media (forced-colors: active) {
      #xmlHighlight { display: none; }
      #xmlCodeSurface.highlighted #xmlEditor { color: CanvasText; caret-color: CanvasText; }
    }
    .editor-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #xmlImport { min-width: 0; max-width: 100%; }
    #editorDiagnostic { max-height: 92px; min-height: 18px; overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap; }
    #refreshAfterSave { width: auto; }
    .check-label { font-weight: normal; margin: 0; }
    #xpathPicker[open] { display: flex; flex-direction: column; gap: 12px; }
    #xpathPicker h2 { margin: 0; font-size: 16px; }
    #preferIds { width: auto; }
    #pickerTree { flex: 1; min-height: 0; overflow: auto; }
    #pickerTree details { margin: 2px 0; }
    #pickerTree summary { white-space: nowrap; }
    .picker-children { margin-left: 14px; border-left: 1px solid rgba(127,127,127,.3); padding-left: 5px; }
    .picker-node { display: inline-block; max-width: calc(100% - 22px); padding: 5px 6px; margin: 1px 0; text-align: left; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-color: transparent; background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .picker-node:hover, .picker-node:focus-visible { background: rgba(40,130,180,.15); border-color: #258a9b; }
    #pickerTree > .picker-node, .picker-children > .picker-node { display: block; }
    #annotationRemark { min-height: 64px; font: inherit; }
    #annotationList { margin-top: 12px; }
    #annotationList details { border-top: 1px solid rgba(127,127,127,.3); padding-top: 8px; }
    #annotationList summary, #annotationList p { overflow-wrap: anywhere; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>XPath Inspector</h1>

  <section>
    <label>Layer name</label>
    <div id="targetName" class="muted">No single layer selected.</div>
    <label for="path" style="margin-top:10px">XPath</label>
    <textarea id="path" spellcheck="false" disabled></textarea>
    <button id="pickXPath" style="margin-top:6px" disabled>Choose XML node</button>
    <label for="valuePreview" style="margin-top:10px">Value preview</label>
    <output id="valuePreview" class="muted" aria-live="polite"></output>
    <div id="textBindingActions" class="row" style="margin-top:10px">
      <button id="bind" class="primary" disabled>Apply binding</button>
      <button id="unbind" disabled>Remove binding</button>
    </div>
    <div id="annotationControls" hidden>
      <label for="annotationRemark" style="margin-top:10px">Remark (required)</label>
      <textarea id="annotationRemark" required></textarea>
      <div class="row" style="margin-top:8px">
        <button id="saveAnnotation" class="primary" disabled>Add XPath</button>
        <button id="cancelAnnotation">Clear</button>
      </div>
      <div id="annotationList"></div>
    </div>
  </section>

  <section>
    <label for="sourceSelect">Document XML source</label>
    <select id="sourceSelect" disabled></select>
    <div id="sourceName" class="muted">No source selected.</div>
    <div id="sourceStorage" class="muted"></div>
    <div class="row" style="margin-top:8px">
      <button id="newSource" disabled>New XML source</button>
      <button id="reloadSource">Reload</button>
    </div>
    <button id="editSource" class="primary" style="width:100%;margin-top:8px" disabled>Edit XML source</button>
    <details>
      <summary>Source XML</summary>
      <textarea id="xmlPreview" aria-label="Source XML" readonly></textarea>
    </details>
  </section>

  <button id="refresh" class="primary" style="width:100%">Refresh all bindings</button>
  <div id="status" class="muted" role="status"></div>

  <dialog id="xpathPicker" aria-labelledby="pickerTitle">
    <h2 id="pickerTitle">Choose XML node</h2>
    <label class="check-label"><input type="checkbox" id="preferIds" /> Prefer unique ID attributes</label>
    <div id="pickerTree" aria-label="XML nodes"></div>
    <button id="closePicker">Cancel</button>
  </dialog>

  <dialog id="sourceEditor" aria-labelledby="editorTitle">
    <h2 id="editorTitle">XML source editor</h2>
    <label for="editorSourceName">Source name</label>
    <input id="editorSourceName" maxlength="120" />
    <label for="xmlImport">Import XML file</label>
    <input id="xmlImport" type="file" accept=".xml,text/xml,application/xml" />
    <div class="editor-tools">
      <button id="validateXml">Validate XML</button>
      <button id="prettyPrint">Pretty print</button>
      <button id="cleanXml">Clean tag separators</button>
    </div>
    <div id="xmlCodeSurface">
      <pre id="xmlHighlight" aria-hidden="true"></pre>
      <textarea id="xmlEditor" aria-label="XML source code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
    </div>
    <div id="editorPosition" class="muted"></div>
    <div id="editorDiagnostic" role="status" aria-live="polite"></div>
    <label class="check-label"><input type="checkbox" id="refreshAfterSave" checked /> Refresh bindings after saving</label>
    <div class="row">
      <button id="saveSource" class="primary">Save source</button>
      <button id="closeEditor">Close</button>
    </div>
  </dialog>

<script src="vendor/prism-core.js"></script>
<script src="vendor/prism-markup.js"></script>
<script src="vendor/xml-formatter.js"></script>
<script>
  let source = null;
  let selection = null;
  let pageId = null;
  let fileId = null;
  let editorSession = null;
  let savingSource = false;
  let highlightedXml = null;
  let editingAnnotationId = "";
  let annotationsSnapshot = "";
  let sourceOptions = [];

  const $ = (id) => document.getElementById(id);
  const send = (message) => parent.postMessage(message, "*");

  function setStatus(text, level = "") {
    $("status").textContent = text;
    $("status").className = level || "muted";
  }

  function renderSource() {
    $("sourceName").textContent = source ? source.name : selection?.sourceId ? "Bound XML source not found." : "No source selected.";
    $("sourceName").title = source?.id || "";
    $("xmlPreview").value = source?.characters || "";
    $("sourceStorage").textContent = source ? "Stored in this document" : "";
    $("editSource").disabled = !source;
    $("pickXPath").disabled = !source || !selection;
  }

  function renderSelection() {
    $("targetName").textContent = selection ? selection.name : "No single layer selected.";
    $("targetName").title = selection?.id || "";
    $("path").disabled = !selection;
    $("newSource").disabled = !fileId;
    $("unbind").disabled = !selection?.sourceId;
    const nonText = selection && selection.type !== "text";
    $("textBindingActions").style.display = nonText ? "none" : "flex";
    $("annotationControls").hidden = !nonText;
    renderAnnotations();
    renderSource();
    renderPreview();
  }

  function renderPreview() {
    $("bind").disabled = true;
    $("saveAnnotation").disabled = true;
    $("valuePreview").className = "muted";
    $("valuePreview").textContent = "";
    if (!selection || !source || !$("path").value.trim()) return;
    try {
      const value = resolveXml(source.characters, $("path").value.trim());
      $("valuePreview").textContent = value === "" ? "(empty value)" : value;
      $("bind").disabled = selection.type !== "text";
      $("saveAnnotation").disabled = selection.type === "text" || !$("annotationRemark").value.trim();
    } catch (err) {
      $("valuePreview").textContent = err.message || String(err);
      $("valuePreview").className = "error";
    }
  }

  function resetAnnotationForm() {
    editingAnnotationId = "";
    annotationsSnapshot = selection?.annotationsRaw || "";
    $("path").value = "";
    $("annotationRemark").value = "";
    $("saveAnnotation").textContent = "Add XPath";
    $("cancelAnnotation").textContent = "Clear";
    renderPreview();
  }

  function annotationContext() {
    return { targetId: selection?.id, fileId, pageId };
  }

  function renderAnnotations() {
    $("annotationList").replaceChildren();
    if (!selection || selection.type === "text") return;
    const entries = selection.annotations || [];
    if (!entries.length) $("annotationList").textContent = "No XPath entries.";
    for (const entry of entries) {
      const item = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = entry.path;
      const sourceName = document.createElement("p");
      sourceName.className = "muted";
      sourceName.textContent = sourceOptions.find((option) => option.id === entry.sourceId)?.name || "XML source not found";
      const remark = document.createElement("p");
      remark.textContent = entry.remark;
      const actions = document.createElement("div");
      actions.className = "row";
      const edit = document.createElement("button");
      edit.textContent = "Edit entry";
      edit.onclick = () => {
        editingAnnotationId = entry.id;
        annotationsSnapshot = selection.annotationsRaw || "";
        $("path").value = entry.path;
        $("annotationRemark").value = entry.remark;
        $("saveAnnotation").textContent = "Save XPath";
        $("cancelAnnotation").textContent = "Cancel edit";
        if (source?.id !== entry.sourceId) {
          source = null;
          $("sourceSelect").value = entry.sourceId;
          renderSource();
          send({ type: "select-source", sourceId: entry.sourceId, fileId });
        }
        renderPreview();
        $("annotationRemark").focus();
      };
      const remove = document.createElement("button");
      remove.textContent = "Delete entry";
      remove.onclick = () => send({ type: "delete-annotation", ...annotationContext(), annotationId: entry.id, originalAnnotations: selection.annotationsRaw || "" });
      actions.append(edit, remove);
      item.append(summary, sourceName, remark, actions);
      $("annotationList").append(item);
    }
  }

  function normalizeXmlMarkup(xml) {
    return xml.replace(/\x3c!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<(?:"[^"]*"|'[^']*'|[^'">])*>/g, (markup) => {
      if (markup.startsWith("<!") || markup.startsWith("<?")) return markup;
      return markup.replace(/^<\/\u200b+/, "</").replace(/\/\u200b+>$/, "/>");
    });
  }

  function parseXml(xml) {
    if (!xml.trim()) throw new Error("XML must not be empty");
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const parserError = doc.getElementsByTagNameNS("http://www.mozilla.org/newlayout/xml/parsererror.xml", "parsererror")[0]
      || doc.getElementsByTagNameNS("http://www.w3.org/1999/xhtml", "parsererror")[0];
    if (parserError) throw new Error(`Invalid XML: ${parserError.textContent?.trim() || "Parse error"}`);
    return doc;
  }

  function xpathLiteral(value) {
    if (!value.includes("'")) return `'${value}'`;
    if (!value.includes('"')) return `"${value}"`;
    return `concat(${value.split("'").map((part) => `'${part}'`).join(', "\'", ')})`;
  }

  function nodeXPath(node, preferIds = false) {
    if (node.nodeType === 9) return "";
    const attribute = node.nodeType === 2;
    const parent = attribute ? node.ownerElement : node.parentNode;
    const name = node.namespaceURI
      ? `*[local-name()=${xpathLiteral(node.localName)} and namespace-uri()=${xpathLiteral(node.namespaceURI)}]`
      : node.nodeName;
    if (attribute) return `${nodeXPath(parent, preferIds)}/@${name}`;
    const siblings = Array.from(parent.children).filter((child) => child.localName === node.localName && child.namespaceURI === node.namespaceURI);
    const id = node.getAttribute("id");
    const predicate = preferIds && id && siblings.filter((child) => child.getAttribute("id") === id).length === 1
      ? `[@id=${xpathLiteral(id)}]`
      : siblings.length > 1 ? `[${siblings.indexOf(node) + 1}]` : "";
    return `${nodeXPath(parent, preferIds)}/${name}${predicate}`;
  }

  function openXPathPicker() {
    if (!source || !selection) return;
    let doc;
    try {
      doc = parseXml(normalizeXmlMarkup(source.characters));
    } catch (err) {
      setStatus(err.message || String(err), "error");
      return;
    }
    const attributes = (node) => Array.from(node.attributes).filter((attribute) => attribute.namespaceURI !== "http://www.w3.org/2000/xmlns/");
    const shortened = (value) => {
      const prefix = value.slice(0, 100).replace(/\s+/g, " ").trim();
      return prefix + (value.length > 100 ? "..." : "");
    };
    const makeNode = (node, expanded = false) => {
      const attribute = node.nodeType === 2;
      const button = document.createElement("button");
      button.className = "picker-node";
      const value = attribute ? node.value : node.children.length ? "" : node.textContent;
      button.textContent = `${attribute ? "@" : ""}${node.nodeName}${value ? ` = ${shortened(value)}` : ""}`;
      button.title = `Select ${node.nodeName}`;
      button.onclick = (event) => {
        event.preventDefault();
        event.stopPropagation();
        $("path").value = nodeXPath(node, $("preferIds").checked);
        renderPreview();
        $("xpathPicker").close();
        $("path").focus();
      };
      if (attribute || (!node.children.length && !attributes(node).length)) return button;
      const branch = document.createElement("details");
      const summary = document.createElement("summary");
      summary.append(button);
      const children = document.createElement("div");
      children.className = "picker-children";
      let loaded = false;
      const populate = () => {
        if (loaded || !branch.open) return;
        loaded = true;
        for (const child of [...attributes(node), ...node.children]) children.append(makeNode(child));
      };
      branch.append(summary, children);
      branch.ontoggle = populate;
      branch.open = expanded;
      populate();
      return branch;
    };
    $("pickerTree").replaceChildren(makeNode(doc.documentElement, true));
    $("xpathPicker").showModal();
    send({ type: "editor-size", expanded: true });
  }

  function htmlToText(value) {
    const template = document.createElement("template");
    template.innerHTML = value;
    if (!template.content.childElementCount) return value;

    const blocks = new Set(["ADDRESS", "ARTICLE", "ASIDE", "BLOCKQUOTE", "DIV", "DL", "DT", "DD", "FIGURE", "FIGCAPTION", "FOOTER", "H1", "H2", "H3", "H4", "H5", "H6", "HEADER", "LI", "MAIN", "OL", "P", "PRE", "SECTION", "TABLE", "TR", "UL"]);
    const ignored = new Set(["SCRIPT", "STYLE", "TEMPLATE", "IFRAME", "OBJECT"]);
    let text = "";
    const lineBreak = () => { if (text && !text.endsWith("\n")) text += "\n"; };
    const visit = (node) => {
      if (node.nodeType === 3) {
        text += node.textContent;
        return;
      }
      if (node.nodeType !== 1 || ignored.has(node.tagName)) return;
      if (node.tagName === "BR") {
        text += "\n";
        return;
      }
      const block = blocks.has(node.tagName);
      if (block) lineBreak();
      for (const child of node.childNodes) visit(child);
      if (block) lineBreak();
    };
    for (const child of template.content.childNodes) visit(child);
    return text.trim();
  }

  function resolveXml(xml, path) {
    if (!xml || !path) throw new Error("Missing XML or path");
    const doc = parseXml(normalizeXmlMarkup(xml));

    let result;
    try {
      result = doc.evaluate(path, doc, doc.createNSResolver(doc.documentElement), XPathResult.ANY_TYPE, null);
    } catch {
      throw new Error("Invalid XPath or unknown namespace prefix");
    }

    if (result.resultType === XPathResult.STRING_TYPE) return htmlToText(result.stringValue);
    if (result.resultType === XPathResult.NUMBER_TYPE) return String(result.numberValue);
    if (result.resultType === XPathResult.BOOLEAN_TYPE) return String(result.booleanValue);
    const node = doc.evaluate(path, doc, doc.createNSResolver(doc.documentElement), XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
    if (!node) throw new Error("XPath has no matches");
    return htmlToText(node.textContent?.trim() ?? "");
  }

  function editorDiagnostic(text, level = "muted") {
    $("editorDiagnostic").textContent = text;
    $("editorDiagnostic").className = level;
  }

  function prettyPrintXml(xml) {
    parseXml(xml);
    const formatted = require("xml-formatter")(xml, { indentation: "  ", collapseContent: true, lineSeparator: "\n", throwOnFailure: true });
    parseXml(formatted);
    return formatted;
  }

  function syncHighlightScroll() {
    $("xmlHighlight").scrollTop = $("xmlEditor").scrollTop;
    $("xmlHighlight").scrollLeft = $("xmlEditor").scrollLeft;
  }

  function updateHighlight() {
    const xml = $("xmlEditor").value;
    if (xml !== highlightedXml) {
      if (typeof Prism !== "undefined" && Prism.languages.xml) {
        $("xmlHighlight").innerHTML = Prism.highlight(xml + "\n", Prism.languages.xml, "xml");
        $("xmlCodeSurface").classList.add("highlighted");
      } else {
        $("xmlCodeSurface").classList.remove("highlighted");
        $("xmlHighlight").textContent = "";
      }
      highlightedXml = xml;
    }
    syncHighlightScroll();
  }

  function editorIsDirty() {
    return editorSession && ($("xmlEditor").value !== editorSession.originalXml || $("editorSourceName").value !== editorSession.originalName);
  }

  function updateEditorState() {
    updateHighlight();
    const xml = $("xmlEditor").value;
    const beforeCursor = xml.slice(0, $("xmlEditor").selectionStart);
    const line = beforeCursor.split("\n").length;
    const column = beforeCursor.length - beforeCursor.lastIndexOf("\n");
    const invisibleCount = (xml.match(/\u200b/g) || []).length;
    $("editorPosition").textContent = `Line ${line}, column ${column} | ${xml.split("\n").length} lines | ${invisibleCount} U+200B`;
    const dirty = editorIsDirty();
    $("closeEditor").textContent = dirty ? "Discard and close" : "Close";
    for (const id of ["xmlEditor", "xmlImport", "validateXml", "prettyPrint", "cleanXml", "closeEditor", "refreshAfterSave", "editorSourceName"]) $(id).disabled = savingSource;
    $("saveSource").disabled = savingSource || !xml.trim() || !$("editorSourceName").value.trim();
  }

  function validateEditor() {
    try {
      parseXml($("xmlEditor").value);
      editorDiagnostic("Valid XML", "ok");
      return true;
    } catch (error) {
      editorDiagnostic(error.message || String(error), "error");
      return false;
    }
  }

  function openEditor(currentSource) {
    if (!fileId) return;
    editorSession = { sourceId: currentSource?.id || "", originalXml: currentSource?.characters || "", originalName: currentSource?.name || "", fileId };
    $("editorSourceName").value = editorSession.originalName;
    $("xmlEditor").value = editorSession.originalXml;
    $("xmlImport").value = "";
    savingSource = false;
    updateEditorState();
    if (currentSource) validateEditor();
    else editorDiagnostic("");
    $("sourceEditor").showModal();
    send({ type: "editor-size", expanded: true });
    $("xmlEditor").focus();
  }
  $("editSource").onclick = () => { if (source) openEditor(source); };
  $("newSource").onclick = () => openEditor(null);
  $("editorSourceName").oninput = updateEditorState;
  $("xmlEditor").onscroll = syncHighlightScroll;
  $("xmlEditor").oninput = () => {
    editorDiagnostic("Unsaved changes");
    updateEditorState();
  };
  $("xmlEditor").onkeyup = updateEditorState;
  $("xmlEditor").onclick = updateEditorState;
  $("validateXml").onclick = validateEditor;
  $("prettyPrint").onclick = () => {
    try {
      const formatted = prettyPrintXml($("xmlEditor").value);
      $("xmlEditor").focus();
      $("xmlEditor").select();
      if (!document.execCommand("insertText", false, formatted)) $("xmlEditor").setRangeText(formatted, 0, $("xmlEditor").value.length, "start");
      updateEditorState();
      editorDiagnostic("XML formatted", "ok");
    } catch (error) {
      editorDiagnostic(error.message || String(error), "error");
    }
  };
  $("cleanXml").onclick = () => {
    const original = $("xmlEditor").value;
    $("xmlEditor").value = normalizeXmlMarkup(original);
    const removed = original.length - $("xmlEditor").value.length;
    updateEditorState();
    if (validateEditor()) editorDiagnostic(`Valid XML. Removed ${removed} tag separator characters.`, "ok");
  };
  $("xmlImport").onchange = async () => {
    const file = $("xmlImport").files[0];
    if (!file || !editorSession) return;
    const session = editorSession;
    const originalDraft = $("xmlEditor").value;
    try {
      const bytes = await file.arrayBuffer();
      const xml = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      if (editorSession !== session || savingSource) return;
      if ($("xmlEditor").value !== originalDraft) {
        editorDiagnostic("Import cancelled: the draft changed while the file was loading.", "error");
        return;
      }
      $("xmlEditor").value = xml;
      updateEditorState();
      validateEditor();
    } catch (error) {
      if (editorSession === session) editorDiagnostic(`Import failed (UTF-8 required): ${error.message || String(error)}`, "error");
    }
  };
  $("saveSource").onclick = () => {
    if (!editorSession || savingSource || !validateEditor()) return;
    savingSource = true;
    updateEditorState();
    editorDiagnostic("Saving source...");
    send({ type: "save-source", ...editorSession, name: $("editorSourceName").value.trim(), xml: $("xmlEditor").value });
  };
  $("closeEditor").onclick = () => {
    if (!savingSource) $("sourceEditor").close();
  };
  $("sourceEditor").oncancel = (event) => {
    if (savingSource || editorIsDirty()) {
      event.preventDefault();
      if (!savingSource) editorDiagnostic("Unsaved changes", "error");
    }
  };
  $("sourceEditor").onclose = () => {
    editorSession = null;
    send({ type: "editor-size", expanded: false });
  };

  $("sourceSelect").onchange = () => send({ type: "select-source", sourceId: $("sourceSelect").value, fileId });
  $("pickXPath").onclick = openXPathPicker;
  $("closePicker").onclick = () => $("xpathPicker").close();
  $("xpathPicker").onkeydown = (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      $("xpathPicker").close();
    }
  };
  $("xpathPicker").onclose = () => {
    if ($("xpathPicker").open) return;
    $("pickerTree").replaceChildren();
    send({ type: "editor-size", expanded: false });
  };
  $("reloadSource").onclick = () => {
    if (selection && selection.type !== "text") resetAnnotationForm();
    send({ type: "get-selection" });
  };
  $("path").oninput = renderPreview;
  $("annotationRemark").oninput = renderPreview;
  $("cancelAnnotation").onclick = resetAnnotationForm;
  $("saveAnnotation").onclick = () => {
    if (!selection || selection.type === "text" || !source) return;
    const path = $("path").value.trim();
    const remark = $("annotationRemark").value.trim();
    if (!remark) return setStatus("A remark is required for every XPath.", "error");
    try {
      resolveXml(source.characters, path);
      send({ type: "save-annotation", ...annotationContext(), annotationId: editingAnnotationId, originalAnnotations: annotationsSnapshot, sourceId: source.id, xml: source.characters, path, remark });
    } catch (err) {
      setStatus(err.message || String(err), "error");
    }
  };
  $("bind").onclick = () => {
    if (!source) return setStatus("Choose an XML source first.", "error");
    const path = $("path").value.trim();
    try {
      const value = resolveXml(source.characters, path);
      send({ type: "bind", targetId: selection?.id, sourceId: source.id, xml: source.characters, path, value });
    } catch (err) {
      setStatus(err.message || String(err), "error");
    }
  };
  $("unbind").onclick = () => send({ type: "unbind", targetId: selection?.id });
  $("refresh").onclick = () => {
    setStatus("Refreshing…", "muted");
    send({ type: "refresh-all" });
  };

  window.addEventListener("message", (event) => {
    if (event.source !== parent) return;
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;

    if (msg.type === "selection") {
      if ($("xpathPicker").open) $("xpathPicker").close();
      const changedLayer = fileId !== msg.fileId || pageId !== msg.pageId || selection?.id !== msg.shape?.id || selection?.type !== msg.shape?.type;
      if (changedLayer) {
        editingAnnotationId = "";
        $("annotationRemark").value = "";
        $("saveAnnotation").textContent = "Add XPath";
        $("cancelAnnotation").textContent = "Clear";
      }
      if (changedLayer || (!$("path").value && !$("annotationRemark").value && !editingAnnotationId)) annotationsSnapshot = msg.shape?.annotationsRaw || "";
      pageId = msg.pageId;
      fileId = msg.fileId;
      if (changedLayer || selection?.path !== msg.shape?.path) {
        $("path").value = msg.shape?.path || "";
      }
      selection = msg.shape;
      source = msg.source;
      sourceOptions = msg.sources || [];
      $("sourceSelect").replaceChildren();
      const placeholder = new Option("Select XML source", "");
      placeholder.disabled = true;
      $("sourceSelect").add(placeholder);
      for (const item of msg.sources || []) $("sourceSelect").add(new Option(item.name, item.id));
      $("sourceSelect").value = source?.id || "";
      $("sourceSelect").disabled = !msg.sources?.length;
      renderSelection();
    }

    if (msg.type === "status") setStatus(msg.text, msg.level);
    if (msg.type === "annotation-saved" && selection?.id === msg.targetId) {
      resetAnnotationForm();
      setStatus("XPath entries saved.", "ok");
    }

    if (msg.type === "source-save-error" && editorSession) {
      savingSource = false;
      updateEditorState();
      editorDiagnostic(msg.text, "error");
    }

    if (msg.type === "source-saved" && editorSession && editorSession.sourceId === msg.originalSourceId) {
      savingSource = false;
      $("sourceEditor").close();
      setStatus("XML source saved in plugin data.", "ok");
      if ($("refreshAfterSave").checked) send({ type: "refresh-all" });
    }

    if (msg.type === "refresh-data") {
      const results = (msg.items || []).map((item) => {
        if (item.xml == null) {
          return { targetId: item.targetId, ok: false, error: "XML source not found" };
        }
        try {
          return { targetId: item.targetId, ok: true, value: resolveXml(item.xml, item.path) };
        } catch (err) {
          return { targetId: item.targetId, ok: false, error: err.message || String(err) };
        }
      });
      send({ type: "apply-values", results });
    }

    if (msg.type === "refresh-result") {
      const suffix = msg.errors?.length ? ` ${msg.errors.length} error(s): ${msg.errors.join("; ")}` : "";
      setStatus(`Updated ${msg.updated} layer(s).${suffix}`, msg.errors?.length ? "error" : "ok");
    }
  });

  send({ type: "get-selection" });
</script>
</body>
</html>
